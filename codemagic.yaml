# ==============================================================================
# Codemagic CI/CD Configuration for AGOA Academy (iOS Cloud Build)
# Football Academy Management System - Académie Générations Oued Athmania
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # Workflow 1: Coach Mobile App (AGOA Coach iOS)
  # ----------------------------------------------------------------------------
  agoa-coach-ios:
    name: AGOA Coach iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        PACKAGE_NAME: "com.agoa.coach"
        APP_TITLE: "AGOA Coach"
        XCODE_WORKSPACE: "mobile-coach/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          echo "--> Checking Node.js version..."
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          node -v
          npm -v
          echo "--> Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "--> Installing mobile-coach dependencies..."
          cd mobile-coach
          npm install --legacy-peer-deps
          cd ..

      - name: 2. Build Web Application
        script: |
          echo "--> Compiling Vite Coach Mobile Bundle..."
          npm run build:coaches-mobile

      - name: 3. Capacitor Sync iOS
        script: |
          echo "--> Syncing Capacitor iOS platform..."
          if command -v nvm &> /dev/null; then
            nvm use 22 || true
          fi
          cd mobile-coach
          npx cap sync ios --no-pod-install || npx cap copy ios

      - name: 4. Install CocoaPods Dependencies
        script: |
          echo "--> Installing CocoaPods in mobile-coach/ios/App..."
          cd mobile-coach/ios/App
          pod install --repo-update

      - name: 5. Build iOS Archive & IPA
        script: |
          cd mobile-coach/ios/App
          
          if [[ -n "$CM_CERTIFICATE" ]]; then
            echo "--> Setting up code signing certificates..."
            keychain initialize
            xcode-project use-profiles
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App"
          else
            echo "--> Building Release archive without pre-configured signing profile..."
            xcodebuild \
              -workspace "App.xcworkspace" \
              -scheme "App" \
              -configuration Release \
              -destination generic/platform=iOS \
              -archivePath "build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive
              
            echo "--> Packaging IPA from archive..."
            mkdir -p build/Payload
            cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
            cd build
            zip -r AGOA-Coach-iOS.ipa Payload
            cd ..
          fi

    artifacts:
      - mobile-coach/ios/App/build/**/*.ipa
      - mobile-coach/ios/App/build/*.ipa
      - mobile-coach/ios/App/build/App.xcarchive
      - "*.ipa"
    publishing:
      email:
        recipients:
          - admin@agoa-academy.com
        notify:
          success: true
          failure: true

