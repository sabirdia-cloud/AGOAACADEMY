<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#09090b" rx="114"/>
  <!-- Green glow circle -->
  <circle cx="256" cy="256" r="200" fill="#0d2b1e"/>
  <!-- Football pentagon pattern ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Football main circle -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#10b981" stroke-width="18"/>
  
  <!-- Center pentagon -->
  <polygon points="256,190 304,223 287,279 225,279 208,223" fill="#10b981" opacity="0.9"/>
  
  <!-- Side pentagons (simplified connecting lines like a football) -->
  <line x1="256" y1="190" x2="256" y2="136" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="304" y1="223" x2="351" y2="198" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="287" y1="279" x2="320" y2="320" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="225" y1="279" x2="192" y2="320" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="208" y1="223" x2="161" y2="198" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>
  
  <!-- Highlights -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.08"/>
</svg>
